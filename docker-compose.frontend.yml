services:
  aetrix-web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aetrix-web
    restart: unless-stopped
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
