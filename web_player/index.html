<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<title>随身看</title>
<style>
:root{
  --bg:#0b0b10; --bg2:#14141c; --card:#17171f; --line:#26262f;
  --txt:#f2f2f5; --mut:#9a9aa5; --acc:#3b82f6; --badge:#2563eb;
  --r:10px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.45; min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom);
}
[hidden]{display:none !important}
button{font:inherit; color:inherit}

/* ---------- 登录 ---------- */
#login{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px}
.login-card{width:100%; max-width:340px; background:var(--bg2); border:1px solid var(--line); border-radius:16px; padding:28px 24px}
.login-card h1{margin:0 0 4px; font-size:22px}
.login-card p{margin:0 0 20px; color:var(--mut); font-size:13px}
.login-card label{display:block; font-size:13px; color:var(--mut); margin:12px 0 6px}
.login-card input{
  width:100%; padding:12px 14px; border-radius:var(--r); border:1px solid var(--line);
  background:#0e0e14; color:var(--txt); font-size:16px; outline:none;
}
.login-card input:focus{border-color:var(--acc)}
.login-card .btn{
  width:100%; margin-top:20px; padding:13px; border:0; border-radius:var(--r);
  background:var(--acc); color:#fff; font-size:16px; font-weight:600; cursor:pointer;
}
.login-card .btn:disabled{opacity:.5}
#loginErr{color:#f87171; font-size:13px; min-height:20px; margin-top:10px}

/* ---------- 顶栏（吸顶容器） ---------- */
.topwrap{
  position:sticky; top:0; z-index:20;
  background:rgba(11,11,16,.92); backdrop-filter:blur(12px);
}
header{
  display:flex; align-items:center; gap:10px;
  padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top));
  border-bottom:1px solid var(--line);
}
header .logo{font-size:17px; font-weight:700; white-space:nowrap}
header .sp{flex:1}
.iconbtn{
  border:1px solid var(--line); background:var(--bg2); color:var(--txt);
  width:36px; height:36px; border-radius:50%; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; font-size:16px;
}

/* ---------- 库标签 ---------- */
#libTabs{
  display:flex; gap:8px; overflow-x:auto; padding:10px 14px;
  border-bottom:1px solid var(--line); scrollbar-width:none;
}
#libTabs::-webkit-scrollbar{display:none}
#libTabs button{
  flex:0 0 auto; padding:7px 14px; border-radius:999px; cursor:pointer;
  border:1px solid var(--line); background:var(--bg2); color:var(--mut); font-size:13px;
}
#libTabs button.on{background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600}

/* ---------- 搜索 ---------- */
#searchBar{padding:10px 14px; border-bottom:1px solid var(--line)}
#searchBar input{
  width:100%; padding:11px 14px; border-radius:var(--r); border:1px solid var(--line);
  background:#0e0e14; color:var(--txt); font-size:16px; outline:none;
}

/* ---------- 海报墙 ---------- */
#wall{
  display:grid; gap:14px 10px; padding:14px;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
}
@media (max-width:420px){
  #wall{grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); gap:12px 8px; padding:10px}
}
.card{cursor:pointer; min-width:0}
.poster{
  position:relative; aspect-ratio:2/3; border-radius:var(--r); overflow:hidden;
  background:var(--card);
}
.poster img{width:100%; height:100%; object-fit:cover; display:block; background:var(--card)}
.poster .noimg{
  width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  color:var(--mut); font-size:28px; background:linear-gradient(135deg,#1c1c26,#121218);
}
.badge{
  position:absolute; top:6px; right:6px; min-width:24px; height:24px; padding:0 7px;
  border-radius:999px; background:var(--badge); color:#fff; font-size:12px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
}
.rate{
  position:absolute; right:6px; bottom:6px; padding:2px 7px; border-radius:6px;
  background:rgba(0,0,0,.72); color:#fbbf24; font-size:12px; font-weight:700;
}
.progress{position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(255,255,255,.18)}
.progress i{display:block; height:100%; background:var(--acc)}
.card .t{
  margin:7px 2px 0; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.card .y{margin:1px 2px 0; font-size:12px; color:var(--mut)}
#sentinel{height:8px}
#empty{padding:60px 20px; text-align:center; color:var(--mut)}
#loadingMore{padding:18px; text-align:center; color:var(--mut); font-size:13px}

/* ---------- 详情弹窗 ---------- */
#detail{
  position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.6);
  display:flex; align-items:flex-end; justify-content:center;
}
@media (min-width:720px){ #detail{align-items:center; padding:30px} }
.sheet{
  width:100%; max-width:860px; max-height:92vh; overflow-y:auto;
  background:var(--bg2); border-radius:18px 18px 0 0; position:relative;
  -webkit-overflow-scrolling:touch;
}
@media (min-width:720px){ .sheet{border-radius:18px} }
.backdrop{position:relative; aspect-ratio:16/8; background:#000; overflow:hidden}
.backdrop img{width:100%; height:100%; object-fit:cover; display:block}
.backdrop::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(to top, var(--bg2) 4%, transparent 55%);
}
.dclose{
  position:absolute; top:12px; right:12px; z-index:2;
  width:34px; height:34px; border-radius:50%; border:0; cursor:pointer;
  background:rgba(0,0,0,.55); color:#fff; font-size:16px;
}
.dbody{padding:0 18px 26px; margin-top:-34px; position:relative}
.drow{display:flex; gap:14px}
.dposter{width:104px; flex:0 0 104px; aspect-ratio:2/3; border-radius:8px; overflow:hidden; background:var(--card)}
.dposter img{width:100%; height:100%; object-fit:cover; display:block}
.dinfo{min-width:0; padding-top:34px}
.dinfo h2{margin:0 0 6px; font-size:20px; line-height:1.3}
.meta{display:flex; flex-wrap:wrap; gap:6px 12px; color:var(--mut); font-size:13px; margin-bottom:10px}
.meta b{color:#fbbf24}
.overview{color:#d4d4da; font-size:14px; margin:0 0 16px; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden}
.playbtn{
  display:block; width:100%; padding:13px; border:0; border-radius:var(--r); cursor:pointer;
  background:var(--acc); color:#fff; font-size:16px; font-weight:700; margin-bottom:8px;
}
.playbtn:disabled{opacity:.5}
.vsel{
  width:100%; padding:11px; border-radius:var(--r); border:1px solid var(--line);
  background:#0e0e14; color:var(--txt); font-size:14px; margin-bottom:14px;
}
.season-tabs{display:flex; gap:8px; overflow-x:auto; margin:6px 0 4px; scrollbar-width:none}
.season-tabs::-webkit-scrollbar{display:none}
.season-tabs button{
  flex:0 0 auto; padding:7px 13px; border-radius:999px; cursor:pointer; font-size:13px;
  border:1px solid var(--line); background:var(--bg); color:var(--mut);
}
.season-tabs button.on{background:var(--acc); border-color:var(--acc); color:#fff}
.ep{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:11px 4px;
  background:none; border:0; border-bottom:1px solid var(--line); cursor:pointer; color:var(--txt)}
.ep .n{
  flex:0 0 30px; height:30px; border-radius:8px; background:var(--card);
  display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--mut); font-weight:700;
}
.ep .t{min-width:0; flex:1}
.ep .t .e1{font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ep .t .e2{font-size:12px; color:var(--mut)}
.ep .go{color:var(--mut); font-size:18px}
.people{display:flex; gap:10px; overflow-x:auto; padding:4px 0 8px; scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.person{flex:0 0 64px; text-align:center}
.person .av{width:64px; height:64px; border-radius:50%; background:var(--card); overflow:hidden; margin:0 auto 4px;
  display:flex; align-items:center; justify-content:center; color:var(--mut); font-size:20px}
.person .nm{font-size:11px; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.person .rl{font-size:10px; color:#6b6b76; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* ---------- 播放器 ---------- */
#player{position:fixed; inset:0; z-index:50; background:#000; display:flex; flex-direction:column}
#player video{flex:1; width:100%; min-height:0; background:#000}
.pbar{
  display:flex; align-items:center; gap:10px; padding:10px 14px;
  padding-top:calc(10px + env(safe-area-inset-top));
  background:rgba(0,0,0,.7); color:#fff;
}
.pbar .t{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:14px}
#perr{padding:40px 24px; text-align:center; color:#f87171}
.spin{
  width:34px; height:34px; margin:40px auto; border-radius:50%;
  border:3px solid var(--line); border-top-color:var(--acc);
  animation:sp 0.8s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- 登录 -->
<div id="login">
  <form class="login-card" id="loginForm" autocomplete="on">
    <h1>随身看</h1>
    <p>用你的 Emby 账号登录，手机浏览器直接看片</p>
    <label for="u">用户名</label>
    <input id="u" name="username" autocomplete="username" required>
    <label for="p">密码</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button class="btn" id="loginBtn" type="submit">登录</button>
    <div id="loginErr"></div>
  </form>
</div>

<!-- 主页 -->
<div id="home" hidden>
  <div class="topwrap">
    <header>
      <span class="logo">随身看</span>
      <span class="sp"></span>
      <button class="iconbtn" id="searchBtn" aria-label="搜索">🔍</button>
      <button class="iconbtn" id="logoutBtn" aria-label="退出">⏻</button>
    </header>
    <div id="searchBar" hidden><input id="searchInput" placeholder="搜索片名…" enterkeyhint="search"></div>
    <nav id="libTabs"></nav>
  </div>
  <main id="wall"></main>
  <div id="sentinel"></div>
  <div id="loadingMore" hidden><div class="spin"></div></div>
  <div id="empty" hidden>这里空空如也</div>
</div>

<!-- 详情 -->
<div id="detail" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <button class="dclose" id="dclose" aria-label="关闭">✕</button>
    <div class="backdrop"><img id="dBackdrop" alt="" loading="lazy" decoding="async"></div>
    <div class="dbody">
      <div class="drow">
        <div class="dposter"><img id="dPoster" alt="" loading="lazy" decoding="async"></div>
        <div class="dinfo">
          <h2 id="dTitle"></h2>
          <div class="meta" id="dMeta"></div>
        </div>
      </div>
      <p class="overview" id="dOverview"></p>
      <div id="peopleWrap" hidden>
        <div class="people" id="dPeople"></div>
      </div>
      <select class="vsel" id="vsel" hidden></select>
      <button class="playbtn" id="playBtn" hidden>▶ 播放</button>
      <div id="seriesBox" hidden>
        <div class="season-tabs" id="seasonTabs"></div>
        <div id="epList"></div>
      </div>
    </div>
  </div>
</div>

<!-- 播放器 -->
<div id="player" hidden>
  <div class="pbar">
    <button class="iconbtn" id="pclose" aria-label="关闭">✕</button>
    <span class="t" id="pTitle"></span>
  </div>
  <video id="video" controls playsinline webkit-playsinline preload="metadata"></video>
  <div id="perr" hidden></div>
</div>

<script>
'use strict';
/* ============ 工具 ============ */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const store = {
  get k() {
    try {
      return {
        token: localStorage.getItem('wp_token') || '',
        uid: localStorage.getItem('wp_uid') || '',
        name: localStorage.getItem('wp_name') || '',
      };
    } catch { return { token:'', uid:'', name:'' }; }
  },
  set(t, u, n) {
    try {
      localStorage.setItem('wp_token', t);
      localStorage.setItem('wp_uid', u);
      localStorage.setItem('wp_name', n || '');
    } catch {}
  },
  clear() {
    try { localStorage.removeItem('wp_token'); localStorage.removeItem('wp_uid'); localStorage.removeItem('wp_name'); }
    catch {}
  },
};
const DEVICE_ID = (() => {
  try {
    let d = localStorage.getItem('wp_did');
    if (!d) { d = 'wp-' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('wp_did', d); }
    return d;
  } catch { return 'wp-' + Math.random().toString(36).slice(2); }
})();

/* ============ API ============ */
async function api(path, opts = {}) {
  const { token } = store.k;
  const headers = Object.assign(
    { 'X-Emby-Token': token },
    opts.headers || {},
  );
  const r = await fetch(path, Object.assign({}, opts, { headers }));
  if (r.status === 401) { logout(); throw new Error('登录已过期'); }
  if (!r.ok) throw new Error('请求失败 ' + r.status);
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
/* img 标签带不了 header，走 api_key 参数（后端支持，与 user_frontend 同口径） */
const mkey = () => '&api_key=' + encodeURIComponent(store.k.token);
const poster = (id, w) => '/emby/Items/' + encodeURIComponent(id) + '/Images/Primary?maxWidth=' + (w || 300) + mkey();
const backdrop = (id, w) => '/emby/Items/' + encodeURIComponent(id) + '/Images/Backdrop?maxWidth=' + (w || 1280) + mkey();

/* ============ 登录 ============ */
function showLogin() {
  $('#login').hidden = false; $('#home').hidden = true;
}
function showHome() {
  $('#login').hidden = true; $('#home').hidden = false;
}
function logout() {
  store.clear(); location.reload();
}
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#loginBtn'), err = $('#loginErr');
  btn.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/emby/Users/AuthenticateByName', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Emby-Authorization': 'MediaBrowser Client="AetrixWebPlayer", Device="Browser", DeviceId="' + DEVICE_ID + '", Version="1.0.0"',
      },
      body: JSON.stringify({ Username: $('#u').value.trim(), Pw: $('#p').value }),
    });
    if (r.status === 401 || r.status === 429) throw new Error(r.status === 429 ? '尝试太频繁，稍后再试' : '用户名或密码错误');
    if (!r.ok) throw new Error('登录失败(' + r.status + ')');
    const d = await r.json();
    if (!d || !d.AccessToken || !d.User) throw new Error('服务端返回异常');
    store.set(d.AccessToken, String(d.User.Id), d.User.Name || '');
    boot();
  } catch (ex) {
    err.textContent = ex.message || '登录失败';
  } finally {
    btn.disabled = false;
  }
});
$('#logoutBtn').addEventListener('click', logout);

/* ============ 媒体库标签（全部从 Views API 取，不写死） ============ */
let libs = [], curLib = '', searchMode = false, searchTerm = '';
async function loadViews() {
  const d = await api('/emby/Users/me/Views');
  libs = (d && d.Items) || [];
  const nav = $('#libTabs');
  nav.innerHTML = '';
  libs.forEach((l, i) => {
    const b = document.createElement('button');
    b.textContent = l.Name;
    b.dataset.id = l.Id;
    if (i === 0) { b.classList.add('on'); curLib = l.Id; }
    b.addEventListener('click', () => {
      $$('#libTabs button').forEach(x => x.classList.remove('on'));
      b.classList.add('on'); curLib = l.Id;
      exitSearch();
      loadWall(true);
    });
    nav.appendChild(b);
  });
}

/* ============ 海报墙 ============ */
const PAGE = 60;
let startIndex = 0, hasMore = true, loading = false;
function cardHTML(it) {
  const ud = it.UserData || {};
  const unplayed = ud.UnplayedItemCount;
  const badge = unplayed ? '<span class="badge">' + esc(unplayed) + '</span>' : '';
  const rate = it.CommunityRating ? '<span class="rate">★ ' + Number(it.CommunityRating).toFixed(1) + '</span>' : '';
  const pct = ud.PlaybackPositionTicks && it.RunTimeTicks
    ? Math.min(100, Math.round(ud.PlaybackPositionTicks / it.RunTimeTicks * 100)) : 0;
  const prog = pct > 0 ? '<span class="progress"><i style="width:' + pct + '%"></i></span>' : '';
  const img = it.ImageTags && it.ImageTags.Primary
    ? '<img loading="lazy" decoding="async" src="' + poster(it.Id, 300) + '" alt="" onerror="this.remove()">'
    : '<span class="noimg">' + esc((it.Name || '?').slice(0, 1)) + '</span>';
  return '<div class="card" data-id="' + esc(it.Id) + '" data-type="' + esc(it.Type || '') + '">' +
    '<div class="poster">' + img + badge + rate + prog + '</div>' +
    '<div class="t">' + esc(it.Name) + '</div>' +
    '<div class="y">' + esc(it.ProductionYear || '') + '</div>' +
    '</div>';
}
async function loadWall(reset) {
  if (loading || (!reset && !hasMore)) return;
  loading = true;
  if (reset) { startIndex = 0; hasMore = true; $('#wall').innerHTML = ''; $('#empty').hidden = true; }
  $('#loadingMore').hidden = false;
  try {
    const p = new URLSearchParams({
      StartIndex: String(startIndex), Limit: String(PAGE),
      SortBy: 'SortName', SortOrder: 'Ascending',
      Recursive: 'true', EnableTotalRecordCount: 'false',
      IncludeItemTypes: 'Movie,Series',
    });
    if (searchMode && searchTerm) {
      p.set('SearchTerm', searchTerm);
      p.delete('ParentId');
    } else if (curLib) {
      p.set('ParentId', curLib);
    }
    const d = await api('/emby/Users/me/Items?' + p.toString());
    const items = (d && d.Items) || [];
    $('#wall').insertAdjacentHTML('beforeend', items.map(cardHTML).join(''));
    startIndex += items.length;
    /* 不查总数：返回不足一页即到底（go-emby 式） */
    hasMore = items.length >= PAGE;
    if (startIndex === 0 && items.length === 0) $('#empty').hidden = false;
  } catch (e) {
    /* 401 已在 api() 里处理跳登录；其他错误静默 */
  } finally {
    loading = false;
    $('#loadingMore').hidden = true;
  }
}
$('#wall').addEventListener('click', e => {
  const c = e.target.closest('.card');
  if (c) openDetail(c.dataset.id);
});
/* 无限滚动 */
new IntersectionObserver(es => {
  if (es[0].isIntersecting) loadWall(false);
}, { rootMargin: '600px' }).observe($('#sentinel'));

/* ============ 搜索 ============ */
function exitSearch() {
  searchMode = false; searchTerm = '';
  $('#searchBar').hidden = true; $('#searchInput').value = '';
}
$('#searchBtn').addEventListener('click', () => {
  const bar = $('#searchBar');
  if (bar.hidden) { bar.hidden = false; $('#searchInput').focus(); }
  else { exitSearch(); loadWall(true); }
});
let searchTimer = 0;
$('#searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchTerm = e.target.value.trim();
    searchMode = searchTerm.length > 0;
    loadWall(true);
  }, 400);
});

/* ============ 详情 ============ */
let detailItem = null, mediaSources = [];
function metaLine(it) {
  const parts = [];
  if (it.ProductionYear) parts.push(esc(it.ProductionYear));
  if (it.Type === 'Series' && it.ChildCount) parts.push(esc(it.ChildCount) + ' 部');
  if (it.CommunityRating) parts.push('<b>★ ' + Number(it.CommunityRating).toFixed(1) + '</b>');
  if (it.OfficialRating) parts.push(esc(it.OfficialRating));
  if (it.RunTimeTicks) {
    const m = Math.round(it.RunTimeTicks / 600000000);
    if (m > 0) parts.push(m + ' 分钟');
  }
  if (it.Genres && it.Genres.length) parts.push(esc(it.Genres.slice(0, 3).join(' / ')));
  return parts.join('<span> · </span>');
}
async function openDetail(id) {
  $('#detail').hidden = false;
  document.body.style.overflow = 'hidden';
  $('#dTitle').textContent = '加载中…';
  $('#dMeta').innerHTML = ''; $('#dOverview').textContent = '';
  $('#playBtn').hidden = true; $('#seriesBox').hidden = true; $('#vsel').hidden = true;
  $('#peopleWrap').hidden = true;
  try {
    const it = await api('/emby/Users/me/Items/' + encodeURIComponent(id));
    detailItem = it;
    $('#dTitle').textContent = it.Name || '';
    $('#dMeta').innerHTML = metaLine(it);
    $('#dOverview').textContent = it.Overview || '';
    const bp = $('#dBackdrop');
    if (it.BackdropImageTags && it.BackdropImageTags.length) {
      bp.src = backdrop(it.Id, 1280);
      bp.onerror = () => { bp.onerror = null; bp.src = poster(it.Id, 640); };
      bp.hidden = false;
    } else if (it.ImageTags && it.ImageTags.Primary) {
      bp.src = poster(it.Id, 640); bp.hidden = false; bp.onerror = null;
    } else bp.hidden = true;
    const pp = $('#dPoster');
    if (it.ImageTags && it.ImageTags.Primary) { pp.src = poster(it.Id, 320); pp.hidden = false; }
    else pp.hidden = true;
    if (it.People && it.People.length) {
      $('#dPeople').innerHTML = it.People.slice(0, 12).map(p =>
        '<div class="person"><div class="av">' + esc((p.Name || '?').slice(0, 1)) +
        '</div><div class="nm">' + esc(p.Name) + '</div>' +
        (p.Role ? '<div class="rl">' + esc(p.Role) + '</div>' : '') + '</div>'
      ).join('');
      $('#peopleWrap').hidden = false;
    }
    if (it.Type === 'Series') {
      await loadSeasons(it.Id);
      $('#seriesBox').hidden = false;
    } else {
      await prepareMovie(it.Id, it.Name);
    }
  } catch (e) { $('#dTitle').textContent = '加载失败'; }
}
/* 电影：预取播放源；多版本则显示选择器（版本名已对标标准 Emby，PR #209） */
async function prepareMovie(itemId, title) {
  const btn = $('#playBtn'), sel = $('#vsel');
  btn.hidden = true; sel.hidden = true;
  btn.textContent = '▶ 播放'; btn.disabled = false;
  try {
    const d = await api('/emby/Items/' + encodeURIComponent(itemId) + '/PlaybackInfo', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}),
    });
    mediaSources = (d && d.MediaSources) || [];
    if (!mediaSources.length) { btn.hidden = false; btn.disabled = true; btn.textContent = '暂无可播放资源'; return; }
    if (mediaSources.length > 1) {
      sel.innerHTML = mediaSources.map((s, i) =>
        '<option value="' + i + '">' + esc(s.Name || ('版本 ' + (i + 1))) + '</option>').join('');
      sel.hidden = false;
    }
    btn.hidden = false;
    btn.onclick = () => startStream(mediaSources[Number(sel.hidden ? 0 : sel.value)], title);
  } catch (e) {
    /* 降级：播放时再取一次，错误在播放器里展示 */
    btn.hidden = false;
    btn.onclick = () => playItem(itemId, title);
  }
}
async function loadSeasons(seriesId) {
  const d = await api('/emby/Shows/' + encodeURIComponent(seriesId) + '/Seasons');
  const seasons = (d && d.Items) || [];
  const tabs = $('#seasonTabs');
  tabs.innerHTML = '';
  seasons.forEach((s, i) => {
    const b = document.createElement('button');
    b.textContent = s.Name || ('第 ' + (s.IndexNumber || i + 1) + ' 季');
    if (i === 0) b.classList.add('on');
    b.addEventListener('click', () => {
      $$('#seasonTabs button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      loadEpisodes(seriesId, s.Id);
    });
    tabs.appendChild(b);
  });
  if (seasons.length) loadEpisodes(seriesId, seasons[0].Id);
  else $('#epList').innerHTML = '<div id="empty">暂无剧集</div>';
}
async function loadEpisodes(seriesId, seasonId) {
  const p = new URLSearchParams({ SeasonId: seasonId, Limit: '500', SortBy: 'SortName', SortOrder: 'Ascending' });
  const d = await api('/emby/Shows/' + encodeURIComponent(seriesId) + '/Episodes?' + p.toString());
  const eps = (d && d.Items) || [];
  $('#epList').innerHTML = eps.map(ep => {
    const n = ep.IndexNumber != null ? ep.IndexNumber : '';
    const nm = ep.Name && !/^Episode\s*\d+$/i.test(ep.Name) ? ep.Name : '';
    const sub = [ep.ProductionYear || '', ep.RunTimeTicks ? Math.round(ep.RunTimeTicks / 600000000) + ' 分钟' : ''].filter(Boolean).join(' · ');
    return '<button class="ep" data-id="' + esc(ep.Id) + '" data-name="' + esc((ep.SeriesName || (detailItem && detailItem.Name) || '') + ' E' + n) + '">' +
      '<span class="n">' + esc(n) + '</span>' +
      '<span class="t"><span class="e1">' + esc(nm || ('第 ' + n + ' 集')) + '</span>' +
      (sub ? '<span class="e2">' + esc(sub) + '</span>' : '') + '</span>' +
      '<span class="go">›</span></button>';
  }).join('') || '<div id="empty">暂无剧集</div>';
}
$('#epList').addEventListener('click', e => {
  const b = e.target.closest('.ep');
  if (b) playItem(b.dataset.id, b.dataset.name);
});
function closeDetail() {
  $('#detail').hidden = true;
  document.body.style.overflow = '';
}
$('#dclose').addEventListener('click', closeDetail);
$('#detail').addEventListener('click', e => { if (e.target.id === 'detail') closeDetail(); });

/* ============ 播放：<video> 直链，不经过服务器中转 ============ */
async function playItem(itemId, title) {
  $('#player').hidden = false;
  $('#perr').hidden = true;
  const v = $('#video');
  v.removeAttribute('src'); v.load();
  $('#pTitle').textContent = title || '';
  try {
    const d = await api('/emby/Items/' + encodeURIComponent(itemId) + '/PlaybackInfo', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({}),
    });
    const srcs = (d && d.MediaSources) || [];
    if (!srcs.length) throw new Error('没有可播放的资源');
    startStream(srcs[0], title);
  } catch (e) {
    const pe = $('#perr');
    pe.textContent = e.message || '播放失败';
    pe.hidden = false;
  }
}
function startStream(ms, title) {
  const v = $('#video');
  const url = ms && ms.DirectStreamUrl;
  if (!url) { $('#perr').textContent = '没有可播放的地址'; $('#perr').hidden = false; return; }
  if (title) $('#pTitle').textContent = title;
  $('#player').hidden = false;
  $('#perr').hidden = true;
  v.src = url; /* 后端已附 api_key；302 直链，视频不经过服务器 */
  v.play().catch(() => {});
}
$('#video').addEventListener('error', () => {
  const pe = $('#perr');
  pe.textContent = '视频加载失败，可能是源不可用';
  pe.hidden = false;
});
function closePlayer() {
  const v = $('#video');
  v.pause(); v.removeAttribute('src'); v.load();
  $('#player').hidden = true;
}
$('#pclose').addEventListener('click', closePlayer);

/* ============ 启动 ============ */
async function boot() {
  const { token } = store.k;
  if (!token) { showLogin(); return; }
  try {
    await api('/emby/Users/me');
    showHome();
    await loadViews();
    loadWall(true);
  } catch (e) {
    showLogin();
  }
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!$('#player').hidden) closePlayer();
    else if (!$('#detail').hidden) closeDetail();
  }
});
boot();
</script>
