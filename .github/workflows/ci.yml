name: CI

# 门禁口径与本地一致：能跑通这套检查，就是能部署的一套
#   - 两个前端：npm ci（锁文件必须同步）→ vue-tsc 类型检查 → vite build 出 dist
#   - 冒烟测试：TestClient 进程内跑认证 / 管理端接口（快，不需要构建产物）
#   - 部署自检：scripts/deploy_check.py 真起 uvicorn、真发 HTTP，并托管上一步的 dist
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支上的新推送取消上一次还没跑完的检查
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端 · ${{ matrix.dir }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dir: [user_frontend, admin_frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      # package.json 与 package-lock.json 不同步时这里会直接失败（是有意的门禁）
      - name: 安装依赖
        working-directory: ${{ matrix.dir }}
        run: npm ci --no-audit --no-fund

      # 纯文本契约检查：所有 window.location 跳转与 router.push 必须指向本前端已声明的路由。
      # 曾经有两次改动把跳转写成别的项目的 /m/login，类型检查看不出来（字符串就是字符串），
      # 用户会被送到 catch-all 的 404 页。
      - name: 路由契约检查（跳转目标必须存在）
        run: python3 scripts/check_frontend_routes.py

      # 纯文本契约检查：var(--x) 必须在**被引入**的样式表里定义过、令牌不能自引用 /
      # 循环引用、src 下不能有谁都没引入的样式表。曾经 mobile-tokens.css 从未被引入，
      # 而三个组件一直在用它的 --space-md/--card-bg：声明整条作废，卡片没有背景，
      # 构建和类型检查都不会报错。
      - name: 设计令牌契约检查（引用的令牌必须有定义）
        run: python3 scripts/check_frontend_tokens.py

      - name: 类型检查（vue-tsc）
        working-directory: ${{ matrix.dir }}
        run: npm run type-check

      # EM 托管的就是这个目录，构建失败 = 部署上去是旧界面或空白页
      - name: 构建
        working-directory: ${{ matrix.dir }}
        run: npm run build

      # 打成 tar 再上传：dist/ 在 .gitignore 里，直接上传目录可能被忽略规则过滤掉
      - name: 打包构建产物
        working-directory: ${{ matrix.dir }}
        run: tar -czf "$RUNNER_TEMP/${{ matrix.dir }}-dist.tar.gz" dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.dir }}-dist
          path: ${{ runner.temp }}/${{ matrix.dir }}-dist.tar.gz
          if-no-files-found: error
          retention-days: 1

  smoke:
    name: 后端 · 冒烟测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_TYPE: sqlite
      DATABASE_URL: sqlite:///./ci-smoke.db
      REDIS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装后端依赖
        run: pip install -r backend/requirements.txt

      # 不依赖前端构建产物，所以单独一个 job，改后端时能更快拿到反馈
      - name: 门户认证端到端（注册 → 登录 → me → refresh → 改密）
        run: python scripts/smoke_test_auth.py

      - name: 管理端接口冒烟（含后台免登 / 非管理员被拒）
        run: python scripts/smoke_test_admin_v240.py

      - name: 管理员账号工具冒烟（建号 / 升级 / 重置密码 / 真实登录）
        run: python scripts/smoke_test_admin_account.py

      - name: Emby 双模式联动冒烟（EA / 已有 Emby 与自建功能闸门）
        run: python scripts/smoke_test_emby_connection.py

      - name: Emby 会话端点鉴权冒烟（匿名 401 / 越权 403 / 随机会话键）
        run: python scripts/smoke_test_emby_sessions.py

      - name: 安全加固冒烟（WS 鉴权 / 通知鉴权 / 健康检查 / 入口地址 / 后台登录审计）
        run: python scripts/smoke_test_security_hardening.py

      - name: 并发与经济链冒烟（兑换码/签到防重、积分不丢更新、邀请幂等、限流 IP）
        run: python scripts/smoke_test_concurrency.py

      - name: 播放入口链路冒烟（付费墙 / PlaybackInfo / 直连流与 Range / 无路径条目）
        run: python scripts/smoke_test_playback_chain.py

      - name: 运营能力冒烟（卡码 / 设备风控 / 登录日志 / 公告与广播送审）
        run: python scripts/smoke_test_ops_v260.py

      - name: 经济系统端到端冒烟（签到 / 兑换 / 邀请 / 支付回调 / 履约通知）
        run: python scripts/smoke_test_economy.py

      - name: 用户端查漏补缺冒烟（VIP 派生 / 工单通知 / 求片链路）
        run: python scripts/smoke_test_v251.py

      - name: 挂载体检冒烟（EA 视角可达性 / 面板体检落库 / EM 拉取 EA）
        run: python scripts/smoke_test_mount_health.py

      - name: 服务器与求片转交冒烟（多服务器 / 当前使用切换 / MoviePilot 与 qB）
        run: python scripts/smoke_test_servers.py

      - name: 多服运营冒烟（默认服兼容 / 套餐与会员按服 / 共用内容自动化 / 多节点内容边界）
        run: python scripts/smoke_test_realms.py

      # 一个面板同时运营付费服与公益服：免费开放按服判定、默认禁下载、切回付费服立刻恢复付费墙
      - name: 公益服冒烟（免费开放 / 按服判定 / 下载策略 / 面板口径）
        run: python scripts/smoke_test_free_realm.py

      # 会员到期前要有人提醒（否则续费只能指望用户自己想起来）：档位窗口、
      # 一档只发一次、档位推进会补发、到期通知、开关与自定义档位、面板口径与鉴权
      - name: 到期提醒冒烟（窗口 / 去重幂等 / 档位推进 / 面板口径）
        run: python scripts/smoke_test_reminders.py

      # 只测「升级上来的老库」：自动迁移漏列时全新库一切正常、老库直接 500，
      # 只有拿旧形态的库跑一遍才拦得住
      - name: 升级路径冒烟（老库补列 / 迁移幂等 / 后台首页不再 500）
        run: python scripts/smoke_test_schema_migration.py

      # 扫描器是自建后端的资源大户：这条只守“资源行为”（批量查库 / 批量落盘 / 并行 IO / 目录与 TMDB 缓存）
      - name: 扫描资源预算冒烟（批次化 / 并行探测与刮削 / 目录只列一次）
        run: python scripts/smoke_test_scan_budget.py

      # “能跑很久”这件事也要有门禁：崩溃残留的收尾、过期会话回收、临时文件与
      # 孤儿子进程、健康检查是常数级、扫描清理不整库载入内存也不留孤儿行
      - name: 长期运行稳定性冒烟（维护看护 / 临时文件 / 清理阶段资源与数据完整性）
        run: python scripts/smoke_test_maintenance.py

  deploy-check:
    name: 后端 · 部署自检（真起服务 + 真发 HTTP）
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_TYPE: sqlite
      DATABASE_URL: sqlite:///./ci.db
      REDIS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装后端依赖
        run: pip install -r backend/requirements.txt

      - uses: actions/download-artifact@v8
        with:
          pattern: "*-dist"
          merge-multiple: true
          path: ${{ runner.temp }}/dist

      # 自检会检查「EM 实际托管的目录」是否有构建产物，缺了就是假绿
      # --touch：把解包时间当作 mtime，否则 tar 会保留构建时的旧 mtime，
      # 而本 job 的 checkout 晚于构建，自检的「产物落后于源码」新鲜度检查会误报
      - name: 还原前端构建产物
        run: |
          for f in "$RUNNER_TEMP"/dist/*.tar.gz; do
            dir="$(basename "$f" -dist.tar.gz)"
            tar -xzf "$f" -C "$dir" --touch
          done

      # 显式给密钥（生产也必须显式设置；不给自检会自造一个并 WARN）
      - name: 生成自检用 SECRET_KEY
        run: echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"

      # 真起 uvicorn（单进程 + EM/EA 分离两套）跑完整链路，退出码 0 = 通过
      - name: 部署自检
        run: python scripts/deploy_check.py

      - name: 失败时保留自检数据库
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-check-db
          path: |
            ci.db
            ci.db-wal
            ci.db-shm
          if-no-files-found: ignore
          retention-days: 3
