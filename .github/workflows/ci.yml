name: CI

# 门禁口径与本地一致：能跑通这套检查，就是能部署的一套
#   - 两个前端：npm ci（锁文件必须同步）→ vue-tsc 类型检查 → vite build 出 dist
#   - 冒烟测试：TestClient 进程内跑认证 / 管理端接口（快，不需要构建产物）
#   - 部署自检：scripts/deploy_check.py 真起 uvicorn、真发 HTTP，并托管上一步的 dist
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支上的新推送取消上一次还没跑完的检查
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端 · ${{ matrix.dir }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dir: [user_frontend, admin_frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      # package.json 与 package-lock.json 不同步时这里会直接失败（是有意的门禁）
      - name: 安装依赖
        working-directory: ${{ matrix.dir }}
        run: npm ci --no-audit --no-fund

      # 纯文本契约检查：所有 window.location 跳转与 router.push 必须指向本前端已声明的路由。
      # 曾经有两次改动把跳转写成别的项目的 /m/login，类型检查看不出来（字符串就是字符串），
      # 用户会被送到 catch-all 的 404 页。
      - name: 路由契约检查（跳转目标必须存在）
        run: python3 scripts/check_frontend_routes.py

      # 纯文本契约检查：var(--x) 必须在**被引入**的样式表里定义过、令牌不能自引用 /
      # 循环引用、src 下不能有谁都没引入的样式表。曾经 mobile-tokens.css 从未被引入，
      # 而三个组件一直在用它的 --space-md/--card-bg：声明整条作废，卡片没有背景，
      # 构建和类型检查都不会报错。
      - name: 设计令牌契约检查（引用的令牌必须有定义）
        run: python3 scripts/check_frontend_tokens.py

      - name: 类型检查（vue-tsc）
        working-directory: ${{ matrix.dir }}
        run: npm run type-check

      # EM 托管的就是这个目录，构建失败 = 部署上去是旧界面或空白页
      - name: 构建
        working-directory: ${{ matrix.dir }}
        run: npm run build

      # 打成 tar 再上传：dist/ 在 .gitignore 里，直接上传目录可能被忽略规则过滤掉
      - name: 打包构建产物
        working-directory: ${{ matrix.dir }}
        run: tar -czf "$RUNNER_TEMP/${{ matrix.dir }}-dist.tar.gz" dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.dir }}-dist
          path: ${{ runner.temp }}/${{ matrix.dir }}-dist.tar.gz
          if-no-files-found: error
          retention-days: 1

  smoke:
    name: 后端 · 冒烟测试
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_TYPE: sqlite
      DATABASE_URL: sqlite:///./ci-smoke.db
      REDIS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装后端依赖
        run: pip install -r backend/requirements.txt

      # 可选依赖 zhconv（繁简互搜）。它**不在** requirements.txt 里——未安装时搜索会自动
      # 降级为不做转换而不是崩掉，这是有意的设计。但门禁要覆盖这个特性，所以 CI 显式装上，
      # 让 smoke_test_media_search 的繁简断言真跑（否则那一条只会 SKIP，等于没测）。
      - name: 安装可选依赖（繁简互搜）
        run: pip install zhconv

      # 纯文本契约检查，最先跑：把「async 端点改成同步 def、但别处还在 await 它」
      # 这类只有真打到那个请求才炸的改动挡在门口（性能整改会反复做这类改造）。
      - name: await 契约检查（await 的目标必须是协程函数）
        run: python scripts/check_await_consistency.py

      # 另一条同源护栏：async 路由里不许出现同步 SQLAlchemy（FastAPI 只在事件循环上跑
      # async 端点）。存量记在脚本的 BASELINE 里，只许减少不许增加。
      - name: 阻塞路由契约检查（async 路由里做同步 DB 只减不增）
        run: python scripts/check_blocking_routes.py

      # 不依赖前端构建产物，所以单独一个 job，改后端时能更快拿到反馈
      - name: 门户认证端到端（注册 → 登录 → me → refresh → 改密）
        run: python scripts/smoke_test_auth.py

      - name: 管理端接口冒烟（含后台免登 / 非管理员被拒）
        run: python scripts/smoke_test_admin_v240.py

      - name: 管理员账号工具冒烟（建号 / 升级 / 重置密码 / 真实登录）
        run: python scripts/smoke_test_admin_account.py

      - name: Emby 双模式联动冒烟（EA / 已有 Emby 与自建功能闸门）
        run: python scripts/smoke_test_emby_connection.py

      - name: Emby 会话端点鉴权冒烟（匿名 401 / 越权 403 / 随机会话键）
        run: python scripts/smoke_test_emby_sessions.py

      # 自建后端的完整链路（扫描入库 → 媒体库/条目 → 播放信息 → 停止会话）。
      # 这条是 EM 的“主干道”，此前只在开发机上跑过；ffmpeg 不在时 HLS 段自动 SKIP。
      - name: Emby 后端主链路冒烟（扫描 / 媒体库 / 条目 / 播放 / 停止）
        run: python scripts/smoke_test_emby.py

      # 网关：客户端带着 X-Emby-Token / api_key 打进来，要能落到正确的用户与权限上，
      # 且匿名与错键不能借网关绕过鉴权。
      - name: Emby 网关冒烟（令牌落地 / 匿名与错键不放行）
        run: python scripts/smoke_test_emby_gateway.py

      # EM/EA 分离部署：两边各自鉴权、跨服务器取流、配置缺失时的降级。
      # 分离是我们推荐的部署形态，而这条链路此前没有门禁。
      - name: EM/EA 分离部署冒烟（双边鉴权 / 跨服取流 / 降级）
        run: python scripts/smoke_test_ea_split.py

      - name: 安全加固冒烟（WS 鉴权 / 通知鉴权 / 健康检查 / 入口地址 / 后台登录审计）
        run: python scripts/smoke_test_security_hardening.py

      - name: 并发与经济链冒烟（兑换码/签到防重、积分不丢更新、邀请幂等、限流 IP）
        run: python scripts/smoke_test_concurrency.py

      - name: 播放入口链路冒烟（付费墙 / PlaybackInfo / 直连流与 Range / 无路径条目）
        run: python scripts/smoke_test_playback_chain.py

      # 付费墙单独一条：非会员可看见条目但不能播、下载被拦、有权限后立刻放行。
      - name: 付费墙冒烟（可浏览 / 不可播 / 下载策略 / 开通即放行）
        run: python scripts/smoke_test_paywall.py

      # 转码停止原先是「事件循环上等子进程退出 + 递归删分片」：停一次转码 = 全站卡住。
      # 这里用后台心跳量事件循环被占住多久（同步基线 ≥0.5s vs 异步 <0.15s），并从真实路由
      # 打进去验证「结束播放真的释放了转码」（播放会话键与转码 id 不是一回事）。
      - name: 转码停止冒烟（不阻塞事件循环 / 真的停掉转码 / 并发停止）
        run: python scripts/smoke_test_transcode_stop.py

      - name: 运营能力冒烟（卡码 / 设备风控 / 登录日志 / 公告与广播送审）
        run: python scripts/smoke_test_ops_v260.py

      - name: 经济系统端到端冒烟（签到 / 兑换 / 邀请 / 支付回调 / 履约通知）
        run: python scripts/smoke_test_economy.py

      - name: 用户端查漏补缺冒烟（VIP 派生 / 工单通知 / 求片链路）
        run: python scripts/smoke_test_v251.py

      - name: 用户端 v2.5.0 冒烟（浏览 / 搜索 / 收藏 / 播放记录口径）
        run: python scripts/smoke_test_user_v250.py

      # 全站搜索：标题 / 别名 / 分类命中、分页口径、无结果不报错。
      - name: 媒体搜索冒烟（标题与别名命中 / 分页 / 空结果）
        run: python scripts/smoke_test_media_search.py

      - name: 挂载体检冒烟（EA 视角可达性 / 面板体检落库 / EM 拉取 EA）
        run: python scripts/smoke_test_mount_health.py

      # 存储挂载本体（本地目录 / rclone rc / WebDAV / STRM 的列举与播放 URL 组装）。
      # 播放取流的第一跳就是这里，错一点就是“点开没反应”。
      - name: 存储挂载冒烟（本地 / rclone rc / WebDAV / STRM 列举与取流）
        run: python scripts/smoke_test_mounts.py

      - name: 服务器与求片转交冒烟（多服务器 / 当前使用切换 / MoviePilot 与 qB）
        run: python scripts/smoke_test_servers.py

      - name: 多服运营冒烟（默认服兼容 / 套餐与会员按服 / 共用内容自动化 / 多节点内容边界）
        run: python scripts/smoke_test_realms.py

      # 一个面板同时运营付费服与公益服：免费开放按服判定、默认禁下载、切回付费服立刻恢复付费墙
      - name: 公益服冒烟（免费开放 / 按服判定 / 下载策略 / 面板口径）
        run: python scripts/smoke_test_free_realm.py

      # 会员到期前要有人提醒（否则续费只能指望用户自己想起来）：档位窗口、
      # 一档只发一次、档位推进会补发、到期通知、开关与自定义档位、面板口径与鉴权
      - name: 到期提醒冒烟（窗口 / 去重幂等 / 档位推进 / 面板口径）
        run: python scripts/smoke_test_reminders.py

      # 订单要能关、能退：关单只针对未支付单；退款按账本冲正（积分 + 邀请返利）、
      # 订阅按订单回滚天数、余额不足不硬扣、退过的订单不能被回调重放再发一次货
      - name: 订单退款/关单冒烟（账本冲正 / 天数回滚 / 幂等与鉴权）
        run: python scripts/smoke_test_refunds.py

      # 优惠券：额度是预订制的（下单占 / 付款用 / 关单退款还），预览与实付同口径，
      # 超发防得住、订单金额=实付、超时未支付自动收尾、运营面与鉴权
      - name: 优惠券冒烟（预订制额度 / 折扣口径 / 超发与限用 / 自动收尾 / 运营面）
        run: python scripts/smoke_test_coupons.py

      # 只测「升级上来的老库」：自动迁移漏列时全新库一切正常、老库直接 500，
      # 只有拿旧形态的库跑一遍才拦得住
      - name: 升级路径冒烟（老库补列 / 迁移幂等 / 后台首页不再 500）
        run: python scripts/smoke_test_schema_migration.py

      # 扫描器是自建后端的资源大户：这条只守“资源行为”（批量查库 / 批量落盘 / 并行 IO / 目录与 TMDB 缓存）
      - name: 扫描资源预算冒烟（批次化 / 并行探测与刮削 / 目录只列一次）
        run: python scripts/smoke_test_scan_budget.py

      # “能跑很久”这件事也要有门禁：崩溃残留的收尾、过期会话回收、临时文件与
      # 孤儿子进程、健康检查是常数级、扫描清理不整库载入内存也不留孤儿行
      - name: 长期运行稳定性冒烟（维护看护 / 临时文件 / 清理阶段资源与数据完整性）
        run: python scripts/smoke_test_maintenance.py

      # 清理阶段的边界：来源目录读不到时必须**跳过**清理（不能把全库当删除），
      # 文件回来要能复活条目。误清理是不可逆事故，得单独钉住。
      - name: 扫描清理阶段冒烟（来源不可读则跳过 / 条目复活 / 不误删）
        run: python scripts/smoke_test_scan_cleanup.py

      # 扫描结果要能查、而且要诚实：没扫过 ≠ 扫了都是 0；有来源读不到是 partial（已跳过清理）
      # 而不是 success；异常必须留下原因且把互斥与 is_scanning 都复位（否则这个库再也扫不动）。
      - name: 扫描结果可查冒烟（落库 / partial 口径 / 异常不卡死）
        run: python scripts/smoke_test_scan_result.py

      # tests/ 下的单元测试（播放地址口径 / 路径沙箱这类纯逻辑）。以前它们没有任何运行入口，
      # 写完就只能靠人记得手动跑——于是“播放地址口径改坏了”只能在冒烟里才暴露。
      - name: 单元测试（pytest：媒体路径沙箱与播放地址口径）
        run: |
          pip install pytest
          python -m pytest tests/ -q

      # 静态护栏也要自证“它会失败”：否则正则写歪、路径找错、基线比实际大，
      # 它会永远返回 0 而没任何人知道。这里拿合成代码树喂两条护栏，钉住口径与报错能力。
      - name: 静态护栏自检（护栏真的会失败 / 不误报同步 def 与下放的嵌套函数）
        run: python scripts/smoke_test_static_guards.py

      # 分类筛选从「逗号文本列 LIKE 全表扫」换成「条目↔分类关联表 + 索引」：
      # 写入侧自动同步（ORM 钩子）、老库自动补块、结果与旧口径逐条一致、
      # 索引真的被用上（EXPLAIN QUERY PLAN），3000 条规模也不退化
      - name: 分类筛选索引冒烟（关联表同步 / 老库补块 / 结果一致 / 索引证据）
        run: python scripts/smoke_test_item_facets.py

      # 升级现场：关联表回填到一半进程被杀 / 重启续跑 / 降级与索引两条路结果逐条一致 /
      # 读请求的补块预算与冷却。这些场景在开发机上很难自然遇到，但真实老库升级必经过。
      - name: 分类关联表升级演练（中断续跑 / 降级口径 / 补块预算）
        run: python scripts/smoke_test_item_facets_upgrade.py

      # 增量扫描：未变动重扫不再逐文件写库（但条目一条不能少）、变了一定处理、
      # 库里缺行必须重建、远程挂载参与增量且不多列目录。这顶的是「追新」这个最常用的路径。
      - name: 增量扫描冒烟（目录指纹 / 跳过与安全的边界 / 远程挂载）
        run: python scripts/smoke_test_scan_incremental.py

      # 挂载目录列举缓存：扫描与播放共用一份、TTL、单飞、失败不缓存（不带病吃旧结果）。
      # 播放方向以前每次都重新逐级列目录，这顶的是「看一个片要问网盘好几次」。
      - name: 挂载目录列举缓存冒烟（共用 / TTL / 单飞 / 115 raw 列表）
        run: python scripts/smoke_test_mount_cache.py

      # 图片本地化：落盘与自愈、失败退回代理、清理与容量上限（有引用的图绝不能删）。
      - name: 图片本地化冒烟（落盘 / 自愈 / 失败回退 / 清理与上限）
        run: python scripts/smoke_test_image_localize.py

      # 115：v2.18.0 起只留「账号 + 直挂」。这个脚本以前没在 CI 里跑过（它当时覆盖的
      # 转存任务已经下线），现在它同时钉住保留的能力与「转存接口 / 任务模型已不存在」——
      # 免得谁把半边能力顺手删掉、或者把一个已经下线的端点接回来。
      - name: 115 账号与直挂冒烟（账号 API / Cookie 优先级 / 客户端 / 转存已下线护栏）
        run: python scripts/smoke_test_115.py

      # 外部服务能力中心（v2.19.0）：代理 / 人机验证 / 邮件 / Telegram / AI / IP 归属地。
      # 这些能力全都靠管理员自己填的凭据才能用，所以这里钉的是「没填时必须无害」
      # （放行 / 不显示 / 不查外部）、「填了必须真生效」与「密钥永不明文回显」。
      - name: 外部服务能力中心冒烟（代理 / 验证 / 邮件 / TG / AI / 归属地）
        run: python scripts/smoke_test_capabilities.py

      # 性能护栏：只跑 2 万条、几秒钟，判定用的是**比值**而不是耗时，所以不受 CI 机器快慢影响。
      # 之前只有“功能正确”的门禁——把索引路径改回全表扫描、或在写入钩子里塞逐条查询，
      # 依赖都是绿的。真差距是阈值的几十倍，只有真改坏了才会红。
      - name: 分类筛选性能护栏（比值阈值 / 索引路径不能退化）
        run: python scripts/benchmark_item_facets.py --guard

  deploy-check:
    name: 后端 · 部署自检（真起服务 + 真发 HTTP）
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_TYPE: sqlite
      DATABASE_URL: sqlite:///./ci.db
      REDIS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装后端依赖
        run: pip install -r backend/requirements.txt

      - uses: actions/download-artifact@v8
        with:
          pattern: "*-dist"
          merge-multiple: true
          path: ${{ runner.temp }}/dist

      # 自检会检查「EM 实际托管的目录」是否有构建产物，缺了就是假绿
      # --touch：把解包时间当作 mtime，否则 tar 会保留构建时的旧 mtime，
      # 而本 job 的 checkout 晚于构建，自检的「产物落后于源码」新鲜度检查会误报
      - name: 还原前端构建产物
        run: |
          for f in "$RUNNER_TEMP"/dist/*.tar.gz; do
            dir="$(basename "$f" -dist.tar.gz)"
            tar -xzf "$f" -C "$dir" --touch
          done

      # 显式给密钥（生产也必须显式设置；不给自检会自造一个并 WARN）
      - name: 生成自检用 SECRET_KEY
        run: echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"

      # 真起 uvicorn（单进程 + EM/EA 分离两套）跑完整链路，退出码 0 = 通过
      - name: 部署自检
        run: python scripts/deploy_check.py

      - name: 失败时保留自检数据库
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-check-db
          path: |
            ci.db
            ci.db-wal
            ci.db-shm
          if-no-files-found: ignore
          retention-days: 3
