name: aetrix-portal

services:
  aetrix-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aetrix-portal:latest
    container_name: aetrix-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AETRIX_ROLE: api
      DATABASE_TYPE: ${DATABASE_TYPE:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/aetrix_unified.db}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EMBY_TRANSCODE_DIR: /data/transcode
      EMBY_IMAGE_DIR: /data/images
      FRONTEND_DIST: /app/user_frontend/dist
      ADMIN_DIST: /app/admin_frontend/dist
      # 存储挂载 · rclone RC：指向同网络的 rclone 容器，容器名即服务名
      MOUNT_RCLONE_RC_URL: ${MOUNT_RCLONE_RC_URL:-http://rclone:5572}
      MOUNT_RCLONE_BIN: ${MOUNT_RCLONE_BIN:-rclone}
      # rclone 集中管理面板：写 rclone.conf 与服务账号要用。
      # 这两个目录必须与 rclone 容器挂的是**同一份宿主目录**，否则写进去的文件
      # rclone 容器看不到（面板显示成功、实际用不了）。
      RCLONE_CONF_PATH: /config/rclone/rclone.conf
      RCLONE_SA_DIR: /sa-accounts
    ports:
      - "${AETRIX_PORT:-8000}:8000"
    volumes:
      - aetrix_data:/data
      - ${MEDIA_ROOT:-./media}:/media:ro
      # rw：面板要写 rclone.conf（.conf 里含 token/secret，故容器内权限收紧为 600）
      - ${RCLONE_CONFIG_DIR:-./rclone}:/config/rclone
      # rw：面板要写服务账号 JSON（同样 chmod 600）
      - ${RCLONE_SA_DIR:-/root/sa-accounts}:/sa-accounts
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rclone:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5

  # 后台任务进程（v2.41.0 后端拆分）：扫描/探测/补全/定时/提醒/追新，不监听 HTTP。
  # 与 aetrix-api 共享数据库、Redis、数据卷；单实例由 Redis 分布式锁保证。
  aetrix-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: aetrix-portal:latest
    container_name: aetrix-worker
    restart: unless-stopped
    command: ["python3", "-m", "backend.worker"]
    env_file:
      - .env
    environment:
      AETRIX_ROLE: worker
      DATABASE_TYPE: ${DATABASE_TYPE:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/aetrix_unified.db}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EMBY_TRANSCODE_DIR: /data/transcode
      EMBY_IMAGE_DIR: /data/images
      # 存储挂载 · rclone RC：指向同网络的 rclone 容器，容器名即服务名
      MOUNT_RCLONE_RC_URL: ${MOUNT_RCLONE_RC_URL:-http://rclone:5572}
      MOUNT_RCLONE_BIN: ${MOUNT_RCLONE_BIN:-rclone}
      RCLONE_CONF_PATH: /config/rclone/rclone.conf
      RCLONE_SA_DIR: /sa-accounts
    volumes:
      - aetrix_data:/data
      - ${MEDIA_ROOT:-./media}:/media:ro
      # 与 API 同源：worker 的探测 worker 也要读同一份 rclone.conf
      - ${RCLONE_CONFIG_DIR:-./rclone}:/config/rclone
      - ${RCLONE_SA_DIR:-/root/sa-accounts}:/sa-accounts
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rclone:
        condition: service_started
    # 健康检查：worker 心跳写在 Redis 里（aetrix:worker:heartbeat），60 秒内有心跳即健康
    healthcheck:
      test: ["CMD", "python3", "-c", "import redis,os,json; r=redis.from_url(os.getenv('REDIS_URL','redis://redis:6379/0'), decode_responses=True); h=r.get('aetrix:worker:heartbeat'); assert h and (__import__('time').time()-json.loads(h)['updated_at'])<90, 'no heartbeat'"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # Emby 协议网关（EA）。第三方播放器经**宿主机 nginx** 的 8001 进来。
  #
  # 曾经是手工 docker run 起的孤儿容器（没有 compose 标签），带来三个问题：
  #   1. `docker compose up -d` 不会重建它，镜像更新后 EA 还跑在旧代码上；
  #      `docker compose down` 也不会收它；
  #   2. 健康检查探的是 8000，而 emby_api 实际监听 8001，于是永远 unhealthy；
  #   3. 挂的是 /opt/aetrix-portal/rclone.conf —— 那份文件已随仓库清理被删除，
  #      容器一旦重启就会挂成空目录，直链（302）随之失效。
  #
  # 端口安排：宿主 8001 归 nginx，EA 另开一个**内部端口**给 nginx 反代。
  #
  # 为什么不让 EA 直接占宿主 8001：面板容器要回连本机公网 IP，命中 docker-proxy
  # 会踩 hairpin NAT 超时；改由宿主机 nginx 监听 8001 反代进网络，绕开该问题。
  #
  # 为什么 nginx 指向 127.0.0.1:8002 而不是容器 IP：
  #   - 写死容器 IP 会在容器重建后失效（实测 IP 从 172.18.0.10 变成 172.18.0.7，
  #     nginx 还指着旧地址 → 502，且没有任何告警）；
  #   - 想在 nginx 里用容器名解析也不行：nginx 跑在**宿主机**上，
  #     而 Docker 内嵌 DNS 127.0.0.11 只存在于容器网络命名空间里，宿主机不可用。
  # 走 127.0.0.1:<固定端口> 既不依赖 IP，也保留 nginx 这一跳。
  ea:
    build:
      context: .
      dockerfile: Dockerfile
    image: aetrix-portal:latest
    container_name: aetrix-ea
    restart: unless-stopped
    command: ["python", "-m", "emby_api.main"]
    env_file:
      - .env
    environment:
      AETRIX_ROLE: ea
      # emby_api 真正读的是 EMBY_API_PORT（默认 8001）；AETRIX_PORT 仅为排障时对齐日志。
      AETRIX_PORT: 8001
      EMBY_API_PORT: 8001
      DATABASE_TYPE: ${DATABASE_TYPE:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/aetrix_unified.db}
      # 直链（302）：文件 ID 走 rclone RC，access token 从 rclone.conf 现读现刷。
      ENABLE_DIRECT_URL: ${ENABLE_DIRECT_URL:-true}
      RCLONE_CONF_PATH: /config/rclone/rclone.conf
      RCLONE_RC_URL: ${MOUNT_RCLONE_RC_URL:-http://rclone:5572}
      MOUNT_RCLONE_RC_URL: ${MOUNT_RCLONE_RC_URL:-http://rclone:5572}
    ports:
      # 仅供宿主机 nginx 反代。外部访问请走 8001（nginx），不要直接用这个端口。
      - "${EA_INTERNAL_PORT:-8002}:8001"
    volumes:
      - aetrix_data:/data
      # 与 rclone 服务挂同一份配置：直链要读 token，服务账号 remote 也要能解析到路径。
      # 之前这里写的是 /opt/aetrix-portal/rclone.conf，那个文件已随仓库清理被删除，
      # 容器一旦重启就会挂成空目录，直链随之失效。
      - ${RCLONE_CONFIG_DIR:-./rclone}:/config/rclone
      - ${RCLONE_SA_DIR:-/root/sa-accounts}:/sa-accounts:ro
    depends_on:
      postgres:
        condition: service_healthy
      rclone:
        condition: service_started
    # 必须探 EA 真正监听的端口（8001）。探 8000 会让健康检查永远失败，
    # 而 update.sh 之后按容器健康度判断，误报会掩盖真实故障。
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aetrix-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # PostgreSQL：几千用户量级的主数据库（SQLite 单写锁扛不住几千人的并发写）。
  #
  # 默认仍是 SQLite（DATABASE_TYPE=sqlite），这个容器空跑、几乎不占资源；
  # 要切 PG：在 .env 里设 DATABASE_TYPE=postgresql
  #   DATABASE_URL=postgresql://aetrix:<密码>@postgres:5432/aetrix
  # 数据迁移见 scripts/migrate_sqlite_to_pg.py（生产切换要停机窗口，另行安排）。
  #
  # 密码走环境变量 POSTGRES_PASSWORD，不写死。开发机默认有个弱密码能直接起，
  # 生产 .env 里必须改掉。
  postgres:
    image: postgres:16-alpine
    container_name: aetrix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aetrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aetrix_dev_only_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-aetrix}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aetrix} -d $${POSTGRES_DB:-aetrix}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # rclone RC：把 remote 定义接进 Aetrix「存储挂载」，凭据只放在挂载卷里
  rclone:
    image: rclone/rclone:1.71.1
    container_name: aetrix-rclone
    restart: unless-stopped
    command:
      - rcd
      - --rc-serve
      - --rc-addr=0.0.0.0:5572
      - --rc-user=${RCLONE_RC_USER:?请在 .env 设置 RCLONE_RC_USER}
      - --rc-pass=${RCLONE_RC_PASS:?请在 .env 设置 RCLONE_RC_PASS}
    environment:
      # Go 堆内存上限（安全阀，不是调优）：
      # 实测 rcd 在持续 RC 调用（扫描列目录）下堆会涨到 2.6GB（23M live objects，
      # 强制 GC 只能回收约 2%），说明是 rclone 内部累积而非可 GC 的垃圾。
      # GOMEMLIMIT 降不下来这部分，只能防止它继续涨爆整机内存。
      # 真正的根治是第二步：Drive 走 SA 池直调 API，彻底不用 rcd（见 PR 描述）。
      - GOMEMLIMIT=${RCLONE_RCD_GOMEMLIMIT:-4GiB}
    # 配置目录要可写：rclone 刷新 OAuth token / 写回 remote 状态时需要落盘，
    # 只读挂载会出现 "Failed to save config ... read-only file system"，
    # 表面能读，实际 token 一过期就再也续不回来。
    volumes:
      - ${RCLONE_CONFIG_DIR:-./rclone}:/config/rclone
      # 服务账号（Google Drive 团队盘常用）：remote 里写
      # ``service_account_file = /sa-accounts/<name>.json``，这里把宿主机目录挂进去。
      # 未配置时用同一个默认目录；目录不存在也不影响启动（rclone 不会主动去读）。
      - ${RCLONE_SA_DIR:-/root/sa-accounts}:/sa-accounts:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5572 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # rclone 取流服务（数据面）：与上面的 rcd（控制面）配套，**必须**开 VFS 缓存。
  #
  # 为什么不用 rcd 取流：rcd --rc-serve 走 operations.OpenFile，**不经过 VFS 层**，
  # 而 VFS 缓存只挂在 VFS 上。rclone 1.71.1 的 rcd 连 --vfs-cache-mode 这个 flag
  # 都没有（实测 `rcd --help | grep -c vfs-cache-mode` → 0），
  # 所以经 rcd 取的每一个 Range 请求都是冷读。
  #
  # 为什么要分两个容器而不是在一个容器里跑两个进程：各自独立健康检查与重启策略，
  # 不用 supervisor/后台化那套（信号处理、僵尸进程都会出问题），配置也更清楚。
  rclone-serve:
    image: rclone/rclone:1.71.1
    container_name: aetrix-rclone-serve
    restart: unless-stopped
    # remote 名硬编码为 MP：面板里那个 rclone 挂载用的就是它。
    # 换 remote 时这里与挂载配置里的 fs 要一起改。
    command:
      - serve
      - http
      - ${RCLONE_SERVE_REMOTE:-MP:}
      - --addr=0.0.0.0:8080
      # 与 rcd 用同一套 RC 凭据；Aetrix 取流时带同样的 Basic 认证
      - --user=${RCLONE_RC_USER:?请在 .env 设置 RCLONE_RC_USER}
      - --pass=${RCLONE_RC_PASS:?请在 .env 设置 RCLONE_RC_PASS}
      # ---- 关键：VFS 缓存 ----
      # full：读写都缓存。Drive 每次 Range 读有约 1.2 秒固定往返
      # （实测 1MB=1.3s、32MB=1.9s，带宽本身有 17MB/s 不差），
      # 播放器的探测与续读全是小 Range，每次都吃这段延迟。
      # 开缓存后读过的区间落本地，重复读从 1.2s 降到毫秒级（实测 2ms）。
      - --vfs-cache-mode=full
      # 限额必须给死：这台机器磁盘有限，而单个 4K 电影就 17GB。
      # min-free-space 是兜底：剩余低于它就停止继续写入缓存（宁可不缓存也不能撑爆盘）。
      # 默认值从 8G 降到 2G：这是**磁盘**缓存上限；实测它只在回退代理
      # 播放时才被用到（正常走 Drive 302 直链），2G 足够覆盖回退场景。
      - --vfs-cache-max-size=${RCLONE_VFS_CACHE_MAX_SIZE:-2G}
      - --vfs-cache-min-free-space=${RCLONE_VFS_CACHE_MIN_FREE:-5G}
      # 预读块：决定一次回源拉多少。32M 对 4K 码率够用，又不至于让小文件浪费。
      - --vfs-read-chunk-size=32M
      # 单文件内存预读上限：每个打开的文件最多在内存里攒这么多，256M→128M。
      # 并发回退流一多，256M/文件很容易把内存吃光。
      - --vfs-read-chunk-size-limit=${RCLONE_VFS_READ_CHUNK_LIMIT:-128M}
      # 缓存目录：rclone **没有** --vfs-cache-dir 这个 flag，VFS 缓存放在
      # 全局 --cache-dir 下的 vfs/ 子目录。写成 --vfs-cache-dir 会直接
      # Fatal error: unknown flag，容器起不来（已实测）。
      - --cache-dir=/config/rclone
      - --dir-cache-time=24h
      # 纯只读用途，关掉这两项省掉一次目录 stat
      - --no-modtime
      - --no-check-certificate
    volumes:
      # 与 rcd 同一份 rclone.conf（服务账号路径、team_drive 都在里面）
      - ${RCLONE_CONFIG_DIR:-./rclone}:/config/rclone
      - ${RCLONE_SA_DIR:-/root/sa-accounts}:/sa-accounts:ro
    # 探 TCP 端口，不要探 HTTP 路径：serve http 配了 --user/--pass，
    # 无凭据请求一律 401（那是**期望行为**，不是故障），拿它当健康标准会永远
    # unhealthy。也刻意不去 poll Drive 列目录——每 30 秒一次纯属烧配额。
    # 与上面 rclone 服务的探针保持一致。
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      rclone:
        condition: service_started

volumes:
  aetrix_data:
  redis_data:
  postgres_data:
