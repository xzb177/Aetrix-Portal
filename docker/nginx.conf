# 前端 nginx 配置：serve 双前端 + 反代后端 API。
# user_frontend → /usr/share/nginx/html/
# admin_frontend → /usr/share/nginx/html/admin/
# 后端地址由环境变量 BACKEND_HOST 决定（默认 aetrix-api:8000），
# 容器启动时 web-entrypoint.sh 会渲染占位符并生成最终配置。

server {
    listen 80;
    # Docker 内置 DNS，动态解析后端容器 IP（容器重建后 IP 会变）
    resolver 127.0.0.11 valid=10s;
    set $backend "${BACKEND_HOST}";
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩静态资源
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 后端 API：面板/用户端所有 /api/* 请求
    location /api/ {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Emby 客户端协议路径：/emby/* 与裸根 /System/* 等
    location /emby/ {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # 流媒体需要大缓冲关闭，直接透传
        proxy_buffering off;
    }

    # 管理后台：/admin/* → admin 前端 dist
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }
    location = /admin {
        return 301 /admin/;
    }

    # 用户端：SPA，全部回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长期缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

