<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover：没有它，iOS 上 env(safe-area-inset-*) 恒为 0，
         底部导航坞与吸底按钮的“避开小白条”内边距会全部失效 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- 移动端浏览器工具栏跟随页面底色（不是品牌色），滚动时不会出现一条亮青色带 -->
    <meta name="theme-color" content="#070b12">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Aetrix —— 自建影音媒体服务平台：在线播放、多服订阅与客户端接入。">
    <link rel="icon" href="/favicon.ico">
    <link rel="manifest" href="/manifest.webmanifest">
    <title>Aetrix - 影音媒体服务平台</title>
    <style>
      /*
       * 首屏启动画面：写在这里（而不是等样式表）有两个原因——
       * 1. JS 挂载前不会先闪一下白底或没有排版的内容；
       * 2. 它天然覆盖了“样式表还没到”的最坏情况，慢网下也只是一片安静的氛围底色。
       * Vue 挂载会把 #app 的内容整体换掉，所以这里不需要额外清理代码。
       */
      html {
        background: #070b12;
        color-scheme: dark;
      }

      body {
        margin: 0;
      }

      #app-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background:
          radial-gradient(1000px 500px at 85% -10%, rgba(167, 139, 250, 0.07), transparent 60%),
          radial-gradient(900px 480px at -10% 0%, rgba(34, 211, 238, 0.08), transparent 55%),
          #070b12;
        color: rgba(234, 242, 251, 0.45);
        font: 13px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        letter-spacing: 0.08em;
      }

      #app-boot .boot-ring {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid rgba(148, 180, 220, 0.2);
        border-top-color: #22d3ee;
        animation: boot-spin 0.8s linear infinite;
      }

      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-boot .boot-ring { animation: none; }
      }

      #app-noscript {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #070b12;
        color: rgba(234, 242, 251, 0.68);
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        text-align: center;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-boot">
        <span class="boot-ring" aria-hidden="true"></span>
        <span>正在载入…</span>
      </div>
    </div>
    <noscript>
      <div id="app-noscript">
        <p>请启用 JavaScript 以使用本网站</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
