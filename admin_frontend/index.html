<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/vite.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#070b12">
    <meta name="color-scheme" content="dark">
    <title>Aetrix Admin</title>
    <style>
      /*
       * 应用根节点只负责占满视口。
       * 这里不要写 display:flex + 居中：
       * 1. 根节点是 flex 容器时，下面的 ::before 会变成与界面并排的一个 flex 项，
       *    首屏加载提示会一直挂在界面上（.loading 类不会自己消失）；
       * 2. justify-content: center 会把超宽内容（宽表格）向两侧顶，左边直接不可见。
       * 背景保持透明，让 body 上的极光渐变透上来。
       */
      #app {
        min-height: 100vh;
        min-height: 100dvh;
      }

      /* 首屏加载提示：固定定位盖满全屏，JS 挂载完成后由 main.ts 去掉 .loading 类 */
      #app.loading::before {
        content: '加载中...';
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #070b12;
        color: #7f93ad;
        font-size: 13px;
        letter-spacing: 0.08em;
      }

      /* 白日模式：预套用脚本已写好 data-theme=light，加载提示同步换浅色，
         不然浅色用户首屏会先闪一下深蓝黑底 */
      html[data-theme='light'] #app.loading::before {
        background: #f5f8fb;
        color: rgba(22, 40, 58, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="app" class="loading"></div>
    <script>
      /*
       * 主题预套用（v2.42.4）：在样式表与 Vue 挂载前把 html[data-theme] 定好，
       * 白日模式不会先闪一下深蓝黑底（FOUC）。口径与 src/composables/useTheme.ts
       * 一致：localStorage('aetrix-theme') = 'light' | 'dark' | 缺省（跟随系统）。
       */
      (function () {
        try {
          var stored = localStorage.getItem('aetrix-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#f5f8fb');
          }
        } catch (e) { /* localStorage 不可用时跟默认深色 */ }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
